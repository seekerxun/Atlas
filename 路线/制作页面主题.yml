route: 制作页面主题
desc: 新增一套外观，不碰核心
entry: false

steps:
  - id: 读契约
    title: 读接口契约
    note: 必读 主题接口.md。石墨只是示例，它的类名和尺寸都不是要求
    docs: [规范/主题制作规范, 视图/说明, 视图/主题接口, 规范/视图规范]
    next: [抄参考]

  - id: 抄参考
    title: 看石墨怎么实现
    note: 要复用就把代码抄进自己目录，不许 import 石墨的模块
    docs: [视图/主题/石墨/样式.css, 视图/主题/石墨/主题.js, 视图/主题/石墨/模板.js]
    next: [写主题]

  - id: 写主题
    title: 写自己的主题
    note: 只建自己的目录。布局键沿用 盒:视图:分组名 和 步:路线名:步骤id
    outputs: ["视图/主题/*/样式.css", "视图/主题/*/*.js"]
    next: [登记验收]

  - id: 登记验收
    title: 登记并验收
    note: 目录.json 只加自己一行。改完主题.js 要刷新页面，切主题看到的是旧脚本
    docs: [规范/主题制作规范]
    outputs: [视图/主题/目录.json]
