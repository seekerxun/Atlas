route: 改共享接口
desc: 扩核心与主题之间的接口，而不是做一个主题
entry: false

steps:
  - id: 读契约
    title: 读现有契约
    note: 先确认这件事非改接口不可。能在主题里解决的不要动核心
    docs:
      - 视图/主题接口
      - 规范/主题制作规范
      - 视图/主题加载器.js
      - 视图/核心.js
    next: [改接口]

  - id: 改接口
    title: 改核心与加载器
    note: 新增必需方法或布局键要同步加校验，缺了要能在启用前报错，而不是运行到一半崩
    outputs: [视图/核心.js, 视图/主题加载器.js]
    next: [跟进主题]

  - id: 跟进主题
    title: 跟进所有已登记主题
    note: 目录.json 里登记了几个就改几个，一个都不能落下
    docs: [视图/主题/目录.json]
    outputs: ["视图/主题/*/样式.css", "视图/主题/*/*.js"]
    next: [写回文档]

  - id: 写回文档
    title: 写回接口文档
    note: 接口文档没更新等于没改完。逐个主题切一遍验证状态保留
    outputs: [视图/主题接口.md, 视图/说明.md, 规范/主题制作规范.md]
