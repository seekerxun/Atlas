# 示例路线，按你的项目改。路线是唯一手写的结构，AI 不许改。
# 先写你最常干的那件事（出一期视频、做一个功能、查一个问题），跑一次看清单对不对。
route: 开工
desc: 进项目先读约定，再按分组写条目
entry: true

steps:
  - id: 读约定
    title: 读项目约定
    note: 只读这两篇，不要遍历目录
    docs:
      - 策划/规范/项目约定
      - 内容/说明
    next: [写条目]

  - id: 写条目
    title: 写条目
    note: 放进对应分组目录；不知道放哪就丢 产出/
    docs:
      - 内容/_模板/条目
    outputs: ["内容/*/*.md"]
    next: [收工]

  - id: 收工
    title: 体检
    note: 跑 atlas 检查，有错误不算完成
    docs:
      - AGENTS
