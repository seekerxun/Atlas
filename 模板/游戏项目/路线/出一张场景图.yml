# 示例路线，按你的项目改。路线是唯一手写的结构，AI 不许改。
route: 出一张场景图
desc: 横版宽场景从需求到可入引擎

steps:
  - id: 需求
    title: 明确需求
    note: 先确认这张图属于哪个世界、挂在哪个条目下
    docs:
      - 策划/规范/美术待办清单
    next: [规范]

  - id: 规范
    title: 读出图规范
    note: 只读这几篇，不要翻 美术/ 下的样张目录
    docs:
      - 策划/规范/多屏宽场景生成规范
      - 策划/规范/横版场景分层规范
      - 策划/规范/场景与角色美术尺度
    next: [生产]

  - id: 生产
    title: 生产
    docs:
      - 策划/规范/横版场景美术生成流程
    outputs: ["资产/W-*/场景/**"]
    next: [挂接]

  - id: 挂接
    title: 挂回内容条目
    note: 目录名带编号就会自动挂上；不带的，手动写进条目的 美术: 字段
    docs:
      - AGENTS