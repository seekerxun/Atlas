# 示例路线，按你的项目改。路线是唯一手写的结构，AI 不许改。
route: 出一张场景图
desc: 场景图从需求到挂回条目

steps:
  - id: 需求
    title: 明确需求
    note: 先确认这张图属于哪个世界、挂在哪个条目下；出图规范写好后加进这一步的 docs
    docs:
      - 内容/说明
    next: [生产]

  - id: 生产
    title: 生产
    note: 生成的一切先落 产出/，按 批次-日期 分目录
    outputs: ["产出/**"]
    next: [挂接]

  - id: 挂接
    title: 挂回内容条目
    note: 挑中的图放进带编号的资产目录会自动挂上；不带的，手动写进条目的 资产: 字段
    outputs: ["资产/W-*/**"]
    next: [自检]

  - id: 自检
    title: 自检
    note: 跑 atlas check
    docs:
      - AGENTS
