# 示例路线，按你的项目改。路线是唯一手写的结构，AI 不许改。
route: 出一个NPC
desc: 单个 NPC 从设定到可进原型

steps:
  - id: 写条目
    title: 写 NPC 条目
    note: 编号写在文件名里，不写进 frontmatter。机制名一律去 策划/机制/机制目录 查，不要自创
    docs:
      - 内容/_模板/NPC
    outputs: ["内容/W-*/NPC/*.md"]
    next: [数值, 人设]

  - id: 数值
    title: 出数值
    note: 数值明细留正文；成批数值走 内容/表/ 的 csv
    docs:
      - 内容/表/说明
    next: [自检]

  - id: 人设
    title: 出人设图
    note: 生成的图先落 产出/，挑中的用 atlas claim 认领到条目
    outputs: ["产出/**", "资产/W-*/NPC-*/**"]
    next: [自检]

  - id: 自检
    title: 自检
    note: 挂势力、挂机制、挂图，跑 atlas check
    docs:
      - AGENTS
