# 示例路线，按你的项目改。路线是唯一手写的结构，AI 不许改。
route: 出一个NPC
desc: 单个 NPC 从设定到可进原型

steps:
  - id: 读规则
    title: 吃规则
    note: 只读这三篇。机制名一律去机制目录查，不要自创
    docs:
      - 策划/系统/角色系统
      - 策划/数值/角色属性
      - 策划/机制/机制目录
    next: [写条目]

  - id: 写条目
    title: 写 NPC 条目
    note: 编号写在文件名里，不写进 frontmatter
    docs:
      - 内容/_模板/NPC
    outputs: ["内容/W-*/NPC/*.md"]
    next: [数值, 人设]

  - id: 数值
    title: 出数值
    docs:
      - 策划/数值/数值标尺
      - 策划/数值/TTK标尺
    tools: [工具/numeric-workbench]
    next: [自检]

  - id: 人设
    title: 出人设图
    docs:
      - 策划/规范/角色美术风格
    outputs: ["资产/W-*/NPC-*/**"]
    next: [自检]

  - id: 自检
    title: 自检
    note: 挂势力、挂机制、挂图，跑 nav check
    docs:
      - AGENTS