# 示例路线，只引用模板自带的文档。策划文档写好后把它们加进对应步骤的 docs。
# 路线是唯一需要手写的东西。改这里，不要让 AI 改。
route: 做一个新世界
desc: 从一个点子到可进原型的世界
entry: true

steps:
  - id: 立项
    title: 世界立项
    note: 先读内容库说明，搞清楚世界目录怎么分；世界观和核心口径写在 策划/ 下
    docs:
      - 内容/说明
    next: [建卡]

  - id: 建卡
    title: 建世界总卡
    note: 从 创意/ 搬过来，定位阶上限和主力量体系
    docs:
      - 内容/_模板/世界
    outputs: ["内容/W-*/世界.md"]
    next: [势力, NPC, 副本]

  - id: 势力
    title: 出势力
    docs:
      - 内容/_模板/势力
    outputs: ["内容/W-*/势力/*.md"]
    next: [剧情]

  - id: NPC
    title: 出 NPC
    note: 所属势力、出现在哪由 NPC 声明
    docs:
      - 内容/_模板/NPC
    outputs: ["内容/W-*/NPC/*.md"]
    next: [剧情, 美术]

  - id: 副本
    title: 出副本
    note: 掉落明细走数据表，副本只写规则
    docs:
      - 内容/_模板/副本
      - 内容/表/说明
    outputs: ["内容/W-*/副本/*.md"]
    next: [美术]

  - id: 剧情
    title: 写剧情
    docs:
      - 内容/_模板/剧情
    outputs: ["内容/W-*/剧情/*.md"]
    next: [美术]

  - id: 美术
    title: 出美术需求
    note: 生成的图先落 产出/，挑中的再认领到条目
    outputs: ["产出/**", "资产/W-*/**"]
    next: [自检]

  - id: 自检
    title: 自检入库
    note: 机制名对不对、关系有没有断、图有没有挂上，跑 atlas check
    docs:
      - AGENTS
