# 项目身份。Atlas 靠这个文件认领项目，注册表只存路径。
名称: {{名称}}
类型: 游戏

# 内容库按哪个维度分目录。游戏项目通常是"世界"，别的项目可能是"模块""客户""版本"。
主分组: 世界

# 内容层类型词表（封闭）。策划层和通用类型由 Atlas 的 词表.yml 固定，这里只声明内容层。
内容类型: [世界, 势力, NPC, 技能, 道具, 副本, 剧情, 异常物, 谱痕, 力量体系]

# 编号前缀。分组专属的带分组码（NPC-W001-001），跨分组的不带（SKL-003）。
编号:
  世界: W
  NPC: NPC
  势力: F
  副本: S
  道具: I
  异常物: A
  剧情: STY
  技能: SKL
  谱痕: TRC
  力量体系: PWR

# 机制名的唯一权威来源：frontmatter 里 `机制:` 的值必须是这个文件里的标题
机制权威: 策划/机制/机制目录.md

# 状态词表。不写就用 Atlas 默认。
# 状态: [草案, 待审查, 可原型, 已定稿, 废弃]

入口路线: 做一个新世界

忽略: [.git, .obsidian, .atlas, node_modules, 产出, Cocos]
