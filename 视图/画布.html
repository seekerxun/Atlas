<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas 画布</title>

<link rel="stylesheet" href="/界面/基础.css">
</head>
<body data-启动中>
<div id="启动状态" role="status">正在加载界面… <button id="重试启动" hidden>重试</button></div>
<div id="顶">
  <div class="品牌"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M5 26 13 7l8 19M9 18h9M22 10l9 19M23 21h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="2" fill="currentColor"/></svg><span><small>Atlas · 项目图谱</small><span id="项目名称行"><button type="button" id="项目" aria-haspopup="dialog" aria-controls="项目窗" title="打开或新建项目"><span id="名">Atlas</span></button><span id="项目空间" aria-live="polite" title="正在统计磁盘占用">…</span><button type="button" id="项目位置" title="在访达中打开项目文件夹" aria-label="在访达中打开项目文件夹"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 6V4.5a1 1 0 0 1 1-1H8l2 2h6.5a1 1 0 0 1 1 1V8M2.5 7.5h15l-1.8 8h-12z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></span></div>
  <div id="签"></div>
  <div id="产出控件"><button type="button" id="产出选择" aria-haspopup="dialog" aria-controls="产出窗" aria-label="产出"></button></div>
  <div id="运行控件"><button type="button" id="运行选择" popovertarget="运行面板" aria-haspopup="dialog" aria-controls="运行面板" aria-label="运行目标"></button>
    <div id="运行面板" popover role="dialog" aria-label="运行目标"></div></div>
  <button type="button" class="丸" id="体检" aria-haspopup="dialog" aria-controls="检查详情" aria-expanded="false"></button>
  <button id="新路线" style="display:none">＋ 新路线</button>
  <div id="搜"><input aria-label="搜索文档全文、路线、工具和资产" placeholder="搜全文、路线、文件…" title="搜索当前项目；多个关键词用空格分隔，需全部匹配。工具和资产按名称、路径搜索。"><kbd>/</kbd><div id="搜果"></div></div>
  <div id="主题控件"><button type="button" id="主题选择" popovertarget="主题面板" aria-haspopup="dialog" aria-controls="主题面板" aria-label="界面主题"></button>
    <div id="主题面板" popover role="dialog" aria-label="界面主题"></div></div>
  <button id="刷" title="重新扫描" aria-label="重新扫描">↻</button>
</div>

<div id="导航"><strong id="视图名">内容</strong><span id="视图数"></span><span class="帮助">点击卡片展开 · 拖动空白平移 · 滚轮缩放</span></div>
<div id="台"><div id="世界"><svg id="线"></svg><div id="阅读幕" aria-hidden="true"></div></div></div>

<div id="未">
  <div class="头"><b>未认领</b><span id="未数"></span>
    <span class="未认领箭头">▾</span></div>
  <div class="体" id="未体"></div>
</div>

<div id="屉"></div>
<div id="角"><button id="缩小" aria-label="缩小画布">−</button><span id="缩"></span><button id="放大" aria-label="放大画布">＋</button><span class="分隔"></span>
  <button id="撤销" disabled title="撤销 ⌘Z">↶</button>
  <button id="重做" disabled title="重做 ⇧⌘Z">↷</button>
  <span class="分隔"></span><button id="回">全局</button></div>
<div id="提示" role="status" aria-live="polite"></div>
<div id="挑"><div class="框"><input aria-label="搜索文档或代码文件" placeholder="搜索文档或代码文件，如 画布.html"><div class="单"></div></div></div>
<dialog id="文件预览" aria-labelledby="文件预览标题">
  <div class="文件预览头"><div><h2 id="文件预览标题">文件预览</h2><div id="文件预览路径"></div></div><button type="button" id="关闭文件预览" autofocus>关闭</button></div>
  <div id="文件预览正文" class="正文" aria-live="polite"></div>
</dialog>
<dialog id="询问" aria-labelledby="询问标题" aria-describedby="询问说明">
  <form id="询问表"><h2 id="询问标题"></h2><p id="询问说明"></p><div id="询问字段"></div>
    <div class="询问钮"><button type="button" id="询问取消">取消</button><button type="submit" id="询问确定">确定</button></div></form>
</dialog>
<dialog id="项目窗" aria-labelledby="项目窗标题">
  <div class="项目窗头"><h2 id="项目窗标题">项目</h2><button type="button" id="关闭项目窗" autofocus>关闭</button></div>
  <div class="项目窗正文"><ul id="项目列表"></ul>
    <div class="项目窗钮"><button type="button" id="新建项目">＋ 新建项目</button><button type="button" id="打开路径">打开其他文件夹…</button></div></div>
</dialog>
<dialog id="产出窗" aria-labelledby="产出窗标题">
  <div class="产出窗头"><h2 id="产出窗标题">产出</h2><span id="产出窗计数"></span><button type="button" id="关闭产出窗">关闭</button></div>
  <div class="产出窗正文"><nav id="产出批次" aria-label="产出批次"></nav><section id="产出批" aria-live="polite"></section></div>
</dialog>
<dialog id="检查详情" aria-labelledby="检查标题" aria-describedby="检查说明">
  <div class="检查头"><h2 id="检查标题">项目检查</h2><span id="检查计数"></span><button id="关闭检查" type="button" autofocus>关闭</button></div>
  <div class="检查正文"><p id="检查说明"></p><ul id="检查列表"></ul></div>
</dialog>

<script src="/界面/主题加载器.js"></script>
<script src="/界面/核心.js"></script>
</body>
</html>
