# Atlas 词表 —— 机器读的唯一来源。规范文档从这里生成，不要两边各写一份。
版本: 1

# ---------------------------------------------------------------- 库
# 顶层分区。由目录推导，不写进 frontmatter。
库:
  策划: {目录: 策划, 说明: 规则层：定义"该怎么做"，跨实例，数量稳定}
  内容: {目录: 内容, 说明: 实例层：按策划产出的具体东西，随项目无限增长}
  创意: {目录: 创意, 说明: 未立项，零门槛，不进导航主图}
  资产: {目录: 资产, 说明: 已认领的产出：图、音、序列帧，按实体编号组织}
  产出: {目录: 产出, 说明: AI 的倾倒区，默认不扫描、不校验，认领后移出}
  路线: {目录: 路线, 说明: 生产流程，手写，少而稳定}
  工具: {目录: 工具, 说明: 脚本与工作台}

# ---------------------------------------------------------------- 类型
# 策划层和通用类型由 Atlas 固定；内容层类型由各项目在 项目.yml 里声明。
类型:
  策划: [总览, 世界观, 系统, 数值, 机制, 规范, 流程]
  通用: [数据表, 创意, 日志, 工具说明]
  # 内容层示例（无常乐园）：世界 势力 NPC 技能 道具 副本 剧情 异常物 谱痕 力量体系

状态: [草案, 待审查, 可原型, 已定稿, 废弃]

# ---------------------------------------------------------------- 字段
字段:
  必填: [类型, 状态]
  推导: [库, 分组]          # 由目录推导，需要时在 frontmatter 里显式覆盖
  # 这几个是项目的骨架文件，不是条目，不要求 frontmatter，也不判孤儿
  豁免: [AGENTS.md, README.md, CLAUDE.md, 项目.yml, .gitignore]
  可选:
    摘要:   {形态: 一行字,        用途: 中景卡片上显示}
    位阶:   {形态: 数字,          用途: 筛选排序}
    机制:   {形态: 名字列表,      用途: 连到机制权威文档，名字必须存在}
    关联:   {形态: 关系名到编号,  用途: 卡片内列出，选中时画一跳线}
    资产:   {形态: 分类到路径,    用途: 卡片缩略图}
    工具:   {形态: 路径列表,      用途: 认领工具，没人认领的会被报出来}
    数据:   {形态: 路径列表,      用途: 指向表文件}
    代码:   {形态: glob 列表,     用途: 文档与代码对应}
    标签:   {形态: 自由词列表,    用途: 搜索筛选}
    扩展:   {形态: 任意键值,      用途: 实验性字段，不校验、不报未知}

# 关系名开放，程序只检查目标存在。下面是建议用法，不是限制。
常见关系: [所属, 敌对, 出现在, 来自, 掉落, 前置, 涉及, 引用]

# ---------------------------------------------------------------- 校验
校验:
  错误:
    E01: 缺 frontmatter
    E02: 缺必填字段
    E03: 类型不在词表内
    E04: 关联指向不存在的条目
    E05: 机制名不在机制权威文档里
    E06: 声明的工具或资产文件不存在
    E07: 路线引用了不存在的文档
    E08: 路线的 next 指向不存在的步骤
    E09: frontmatter 或路线 YAML 解析失败
  警告:
    W01: 孤儿条目（没有任何路线或条目引用它）
    W02: 孤儿工具（没有任何文档声明使用它）
    W03: 孤儿资产（没挂到任何条目）
    W04: 放错位置（脚本不在 工具/，图片不在 资产/ 或 产出/）
    W05: 未归类文件（任何规则都没匹配上）
    W06: 关系成环
    W07: 层级违规（策划层条目硬依赖了内容层实例）
    W08: 文档过长，AI 读它很贵
    W09: 关联/机制 指向已废弃的条目
    W10: 一个工具被三个以上分组共用，服务对象不明确

层级:   # 上层依赖下层 → W07
  - [总览, 世界观, 系统, 数值, 机制, 规范, 流程]
  - [世界, 力量体系, 谱痕]
  - [NPC, 势力, 技能, 道具, 副本, 剧情, 异常物]

上限:
  文档行数: 400
  单条关联数: 8
